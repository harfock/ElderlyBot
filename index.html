<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhanced Punctuation Toolbar</title>
  <style>
    :root {
      --sidebar-width-expanded: 64px;
      --sidebar-width-collapsed: 24px;
      --paper-bg: #121214;
      --paper-line-color: rgba(255, 255, 255, 0.05);
      --margin-line-color: rgba(255, 85, 85, 0.25);
      --btn-bg: linear-gradient(145deg, #2a2d32, #1f2125);
      --btn-active-bg: linear-gradient(145deg, #18191c, #222428);
      --accent-color: #00e5ff;
      --text-color: #e0e6ed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text-color);
      
      /* Dark Realistic Lined Paper Texture using Pure CSS */
      background-color: var(--paper-bg);
      background-image: 
        /* Red Notebook Margin Line */
        linear-gradient(90deg, transparent 79px, var(--margin-line-color) 79px, var(--margin-line-color) 81px, transparent 81px),
        /* Horizontal Paper Lines */
        linear-gradient(var(--paper-line-color) 1px, transparent 1px),
        /* Paper Grain / Noise Simulation */
        radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
      background-size: 100% 100%, 100% 32px, 4px 4px;
      line-height: 32px; /* Matches paper row lines */
      padding-left: 90px; /* Offset for paper margin line */
    }

    /* Main Content Area */
    .content {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .editor-area {
      width: 100%;
      min-height: 300px;
      background: transparent;
      border: none;
      outline: none;
      color: #f0f4f8;
      font-size: 18px;
      line-height: 32px; /* Align text with paper lines */
      resize: vertical;
      font-family: inherit;
    }

    /* Always Floating Sidebar Container */
    .punctuation-sidebar {
      position: fixed;
      top: 50%;
      right: 16px;
      transform: translateY(-50%);
      width: var(--sidebar-width-expanded);
      background: rgba(22, 24, 28, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
      z-index: 9999;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    /* Collapsed State */
    .punctuation-sidebar.collapsed {
      width: var(--sidebar-width-collapsed);
    }

    /* Collapse/Expand Toggle Handle */
    .toggle-btn {
      width: 100%;
      height: 28px;
      background: transparent;
      border: none;
      color: #8a94a6;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: color 0.2s, transform 0.3s;
    }

    .toggle-btn:hover {
      color: var(--accent-color);
    }

    .punctuation-sidebar.collapsed .toggle-btn {
      transform: rotate(180deg);
    }

    /* Button List */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      padding: 6px 8px;
      align-items: center;
      transition: opacity 0.2s ease;
    }

    .punctuation-sidebar.collapsed .btn-group {
      opacity: 0;
      pointer-events: none;
    }

    /* Modern Tactile 3D Button Style */
    .btn-3d {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 10px;
      background: var(--btn-bg);
      color: var(--text-color);
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      outline: none;
      user-select: none;
      
      /* 3D Depth Shadows */
      box-shadow: 
        0 4px 0 #121315,                   /* Bottom 3D edge */
        0 5px 10px rgba(0, 0, 0, 0.4),     /* Soft drop shadow */
        inset 0 1px 1px rgba(255, 255, 255, 0.15); /* Top bevel highlight */
      
      transition: transform 0.08s ease, box-shadow 0.08s ease, color 0.2s ease;
    }

    .btn-3d:hover {
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 
        0 5px 0 #121315,
        0 7px 14px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
    }

    /* Pressed/Active 3D Effect */
    .btn-3d:active {
      background: var(--btn-active-bg);
      transform: translateY(3px); /* Push down */
      box-shadow: 
        0 1px 0 #121315, /* Compressed 3D edge */
        0 2px 4px rgba(0, 0, 0, 0.4),
        inset 0 2px 4px rgba(0, 0, 0, 0.6); /* Inner depth shadow */
      color: var(--accent-color);
    }

    /* Decorative separator */
    .divider {
      width: 24px;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 4px 0;
    }
  </style>
</head>
<body>

  <main class="content">
    <textarea class="editor-area" placeholder="Type here... Use the floating punctuation sidebar on the right to insert symbols."></textarea>
  </main>

  <!-- Always Floating Sidebar -->
  <aside class="punctuation-sidebar" id="punctuationSidebar">
    <button class="toggle-btn" id="toggleBtn" title="Toggle Sidebar">
      &#10095; <!-- Right Arrow Icon -->
    </button>
    
    <div class="divider"></div>

    <div class="btn-group">
      <button class="btn-3d" onclick="insertPunctuation(',')">,</button>
      <button class="btn-3d" onclick="insertPunctuation('.')">.</button>
      <button class="btn-3d" onclick="insertPunctuation('?')">?</button>
      <button class="btn-3d" onclick="insertPunctuation('!')">!</button>
      <button class="btn-3d" onclick="insertPunctuation('“')">“ ”</button>
      <button class="btn-3d" onclick="insertPunctuation(';')">;</button>
      <button class="btn-3d" onclick="insertPunctuation(':')">:</button>
      <button class="btn-3d" onclick="insertPunctuation('—')">—</button>
    </div>
  </aside>

  <script>
    const sidebar = document.getElementById('punctuationSidebar');
    const toggleBtn = document.getElementById('toggleBtn');
    const editor = document.querySelector('.editor-area');

    // Toggle Sidebar Expand / Collapse
    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
    });

    // Helper to insert punctuation at text cursor position
    function insertPunctuation(char) {
      editor.focus();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const text = editor.value;

      if (char === '“') {
        // Wrap selected text or insert pair
        const selected = text.substring(start, end);
        editor.value = text.substring(0, start) + `“${selected}”` + text.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 1 + selected.length;
      } else {
        editor.value = text.substring(0, start) + char + text.substring(end);
        editor.selectionStart = editor.selectionEnd = start + char.length;
      }
    }
  </script>
</body>
</html>



<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warm Reader - Communication Box</title>
    <style>
        :root {
            /* Dynamic Theme Variables - Dark Amber (Default) */
            --paper-bg: #1C1A17; 
            --paper-line-color: rgba(226, 157, 50, 0.18); 
            --margin-line-color: rgba(224, 109, 83, 0.35); 
            --text-color: #FFD166; 
            --ui-text: #F4EAD4; 
            --card-bg: rgba(36, 32, 28, 0.92);
            --punc-btn-bg: linear-gradient(145deg, #3A332C, #2A241F);
            --punc-text-color: #FFD166;
            --btn-warm-primary: linear-gradient(145deg, #E06D53, #C85237); 
            --btn-warm-secondary: linear-gradient(145deg, #4A423A, #36302A); 
            --border-color: rgba(226, 157, 50, 0.2);
            --chars-per-row: 8;
            --line-height-px: 64px;
        }

        /* Theme: Aged Parchment */
        body.theme-aged-parchment {
            --paper-bg: #2C261E;
            --text-color: #FFE8B6;
            --ui-text: #FFF8E7;
            --paper-line-color: rgba(255, 220, 150, 0.15);
            --card-bg: rgba(44, 38, 30, 0.92);
            --punc-btn-bg: linear-gradient(145deg, #42382C, #2F271E);
            --punc-text-color: #FFE8B6;
            --btn-warm-secondary: linear-gradient(145deg, #4A4034, #362E25);
        }

        /* Theme: Cream Paper (Light Mode Fix) */
        body.theme-cream-paper {
            --paper-bg: #FFF8EB;
            --text-color: #2A1F13;
            --ui-text: #2A1F13;
            --paper-line-color: rgba(180, 130, 60, 0.2);
            --margin-line-color: rgba(200, 70, 50, 0.3);
            --card-bg: rgba(245, 235, 218, 0.95);
            --punc-btn-bg: linear-gradient(145deg, #EADBC8, #D5C3A9);
            --punc-text-color: #2A1F13;
            --btn-warm-primary: linear-gradient(145deg, #D95338, #B83A20);
            --btn-warm-secondary: linear-gradient(145deg, #E2D1BC, #C8B59E);
            --border-color: rgba(180, 130, 60, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--paper-bg);
            /* Notebook Lined Paper Effect */
            background-image: 
                linear-gradient(90deg, transparent 85px, var(--margin-line-color) 85px, var(--margin-line-color) 87px, transparent 87px),
                linear-gradient(var(--paper-line-color) 1.5px, transparent 1.5px);
            background-size: 100% 100%, 100% var(--line-height-px);
            background-position: 0 0, 0 16px;
            color: var(--ui-text);
            display: flex;
            flex-direction: column;
            padding: 20px 80px 80px 105px; 
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 3D Tactile Buttons */
        .btn-3d {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--ui-text);
            font-weight: bold;
            cursor: pointer;
            outline: none;
            user-select: none;
            box-shadow: 
                0 4px 0 rgba(0, 0, 0, 0.25),
                0 6px 10px rgba(0, 0, 0, 0.15),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.2s;
        }

        .btn-3d:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .btn-3d:active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 rgba(0, 0, 0, 0.2),
                inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Left Floating Sidebar */
        .punctuation-sidebar {
            position: fixed;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            width: 80px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 10px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 1000;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .punctuation-sidebar.collapsed {
            width: 24px;
        }

        .sidebar-toggle-btn {
            background: transparent;
            border: none;
            color: var(--ui-text);
            cursor: pointer;
            font-size: 12px;
            padding: 4px;
            transition: transform 0.3s;
        }

        .punctuation-sidebar.collapsed .sidebar-toggle-btn {
            transform: rotate(180deg);
        }

        .sidebar-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            align-items: center;
            transition: opacity 0.2s;
        }

        .punctuation-sidebar.collapsed .sidebar-content {
            opacity: 0;
            pointer-events: none;
        }

        .btn-sidebar-action {
            width: 100%;
            padding: 10px 2px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
            text-align: center;
        }

        .btn-sidebar-rewrite {
            background: var(--btn-warm-primary);
            color: #FFF8E7;
        }

        .btn-sidebar-clear {
            background: var(--btn-warm-secondary);
        }

        .sidebar-divider {
            width: 80%;
            height: 1px;
            background: var(--border-color);
            margin: 4px 0;
        }

        .punc-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            align-items: center;
        }

        .btn-punc {
            width: 48px;
            height: 44px;
            font-size: 20px;
            background: var(--punc-btn-bg);
            color: var(--punc-text-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Right Settings & History Drawer */
        .right-sidebar {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 300px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-left: 1px solid var(--border-color);
            padding: 60px 18px 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 999;
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
            overflow-y: auto;
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.4);
        }

        .right-sidebar.open {
            transform: translateX(0);
        }

        .right-toggle-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1001;
            padding: 10px 16px;
            background: var(--btn-warm-secondary);
            font-size: 14px;
        }

        .setting-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-section h3 {
            font-size: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
            color: var(--ui-text);
        }

        .font-adjuster {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.1);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .btn-step {
            width: 34px;
            height: 34px;
            font-size: 18px;
            background: var(--btn-warm-secondary);
        }

        .select-theme, .input-api {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
            color: var(--ui-text);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .history-actions {
            display: flex;
            gap: 8px;
        }

        .btn-hist-action {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }

        .btn-merge { background: linear-gradient(145deg, #2E7D32, #1B5E20); color: white; }
        .btn-delete { background: linear-gradient(145deg, #C62828, #8E0000); color: white; }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            background: rgba(0,0,0,0.08);
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid var(--border-color);
        }

        .history-item input[type="checkbox"] {
            margin-top: 3px;
            transform: scale(1.2);
        }

        .history-text {
            flex: 1;
            cursor: pointer;
            word-break: break-all;
        }

        /* Main Workspace Layout */
        .main-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .instruction-banner {
            font-size: 15px;
            color: var(--ui-text);
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #big-text-input {
            width: 100%;
            flex-grow: 1;
            background: transparent;
            color: var(--text-color);
            border: none;
            padding: 0;
            margin-top: calc(var(--line-height-px) * 0.1);
            font-size: calc((100vw - 190px) / var(--chars-per-row));
            line-height: var(--line-height-px);
            resize: none;
            outline: none;
            word-break: break-all;
            font-family: inherit;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #big-text-input::placeholder {
            color: var(--text-color);
            opacity: 0.4;
        }

        /* Toast Banner Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(184, 45, 30, 0.92);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none;
            z-index: 2000;
            text-align: center;
        }
    </style>
</head>
<body class="theme-warm-amber">

    <!-- Toast Notification Banner for Errors -->
    <div id="toast" class="toast"></div>

    <!-- Left Floating Sidebar -->
    <aside id="left-sidebar" class="punctuation-sidebar">
        <button class="sidebar-toggle-btn" onclick="toggleLeftSidebar()" title="Collapse/Expand">◄</button>
        
        <div class="sidebar-content">
            <button id="rewrite-btn" class="btn-3d btn-sidebar-action btn-sidebar-rewrite" onclick="handleRewrite()">
                AI 重寫<br><span style="font-size:10px; opacity:0.8;">Rewrite</span>
            </button>
            <button class="btn-3d btn-sidebar-action btn-sidebar-clear" onclick="clearText()">
                清除<br><span style="font-size:10px; opacity:0.8;">Clear</span>
            </button>

            <div class="sidebar-divider"></div>

            <div class="punc-group">
                <button class="btn-3d btn-punc" onclick="insertPunctuation('，')">，</button>
                <button class="btn-3d btn-punc" onclick="insertPunctuation('。')">。</button>
                <button class="btn-3d btn-punc" onclick="insertPunctuation('？')">？</button>
                <button class="btn-3d btn-punc" onclick="insertPunctuation('！')">！</button>
                <button class="btn-3d btn-punc" onclick="insertPunctuation('：')">：</button>
                <button class="btn-3d btn-punc" onclick="insertPunctuation('；')">；</button>
                <button class="btn-3d btn-punc" onclick="insertPunctuation('「')">「</button>
                <button class="btn-3d btn-punc" onclick="insertPunctuation('」')">」</button>
                <button class="btn-3d btn-punc" onclick="insertPunctuation('、')">、</button>
            </div>
        </div>
    </aside>

    <button class="btn-3d right-toggle-btn" onclick="toggleRightSidebar()">⚙ 設定 Settings</button>

    <!-- Right Settings & History Sidebar -->
    <aside id="right-sidebar" class="right-sidebar">
        <div class="setting-section">
            <h3>API 金鑰 (API Key)</h3>
            <input type="password" id="api-key" class="input-api" placeholder="Enter OpenRouter API Key (sk-or-...)">
        </div>

        <div class="setting-section">
            <h3>字體大小 (Font Size)</h3>
            <div class="font-adjuster">
                <span>每行字數 Chars/Row:</span>
                <div>
                    <button class="btn-3d btn-step" onclick="changeFontSize(1)">+</button>
                    <span id="chars-display" style="margin: 0 6px; font-weight: bold;">8</span>
                    <button class="btn-3d btn-step" onclick="changeFontSize(-1)">-</button>
                </div>
            </div>
        </div>

        <div class="setting-section">
            <h3>配色主題 (Theme)</h3>
            <select id="theme-select" class="select-theme" onchange="applyTheme(this.value)">
                <option value="theme-warm-amber">溫暖琥珀 (Warm Amber)</option>
                <option value="theme-aged-parchment">復古羊皮紙 (Aged Parchment)</option>
                <option value="theme-cream-paper">柔和奶油白 (Warm Cream Daylight)</option>
            </select>
        </div>

        <div class="setting-section">
            <h3>歷史紀錄 (History)</h3>
            <div class="history-actions">
                <button class="btn-3d btn-hist-action btn-merge" onclick="mergeSelectedHistory()">合併選取 Merge</button>
                <button class="btn-3d btn-hist-action btn-delete" onclick="deleteSelectedHistory()">刪除選取 Delete</button>
            </div>
            <div id="history-list" class="history-list"></div>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-container">
        <div class="instruction-banner">
            💡 <span>點擊下方輸入框直接打字，側邊欄可插入標點符號與 AI 重寫。</span>
        </div>

        <textarea id="big-text-input" placeholder="請在此輸入文字..."></textarea>
    </main>

    <script>
        const WORKER_URL = "https://openrouter-proxy.tinycarton.workers.dev/";

        const input = document.getElementById('big-text-input');
        const apiKeyInput = document.getElementById('api-key');
        const rewriteBtn = document.getElementById('rewrite-btn');
        const historyListEl = document.getElementById('history-list');
        const toastEl = document.getElementById('toast');

        let charsPerRow = parseInt(localStorage.getItem('saved_chars_per_row')) || 8;
        let historyItems = JSON.parse(localStorage.getItem('saved_history_items')) || [];
        let isFirstInput = true;

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('openrouter_key')) {
                apiKeyInput.value = localStorage.getItem('openrouter_key');
            }

            const savedTheme = localStorage.getItem('saved_theme') || 'theme-warm-amber';
            document.getElementById('theme-select').value = savedTheme;
            applyTheme(savedTheme);

            updateFontCSS();
            renderHistory();
        });

        input.addEventListener('focus', handleInitialClear);
        input.addEventListener('input', handleInitialClear);

        function handleInitialClear() {
            if (isFirstInput) {
                isFirstInput = false;
                if (input.value === "請在此輸入文字...") {
                    input.value = "";
                }
            }
        }

        apiKeyInput.addEventListener('change', () => {
            localStorage.setItem('openrouter_key', apiKeyInput.value.trim());
        });

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.style.display = 'block';
            setTimeout(() => { toastEl.style.display = 'none'; }, 4000);
        }

        function toggleLeftSidebar() {
            document.getElementById('left-sidebar').classList.toggle('collapsed');
        }

        function toggleRightSidebar() {
            document.getElementById('right-sidebar').classList.toggle('open');
        }

        function changeFontSize(delta) {
            charsPerRow = Math.max(4, Math.min(16, charsPerRow - delta));
            localStorage.setItem('saved_chars_per_row', charsPerRow);
            updateFontCSS();
        }

        function updateFontCSS() {
            document.documentElement.style.setProperty('--chars-per-row', charsPerRow);
            document.getElementById('chars-display').textContent = charsPerRow;
        }

        function applyTheme(themeClass) {
            document.body.className = themeClass;
            localStorage.setItem('saved_theme', themeClass);
        }

        function insertPunctuation(char) {
            handleInitialClear();
            input.focus();
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;

            input.value = text.substring(0, start) + char + text.substring(end);
            input.selectionStart = input.selectionEnd = start + char.length;
        }

        async function handleRewrite() {
            const rawText = input.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!rawText) return;

            if (!apiKey) {
                showToast("請在右側設定欄輸入 OpenRouter API Key");
                toggleRightSidebar();
                return;
            }

            rewriteBtn.disabled = true;
            rewriteBtn.innerHTML = "重寫中...<br><span style='font-size:10px;'>Rewriting</span>";

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        text: rawText,
                        apiKey: apiKey,
                        systemPrompt: "You are a communication assistant helping elderly users clearly format and rewrite text. Clean up grammar, fix typos, and preserve original intent without refusing user text unless strictly harmful."
                    })
                });

                const data = await response.json();

                if (data.choices && data.choices[0] && data.choices[0].message) {
                    const rewritten = data.choices[0].message.content.trim();
                    
                    if (rewritten.toLowerCase().includes("server busy") || rewritten.startsWith("unchanged :")) {
                        showToast("⚠️ 重寫失敗：AI 未有及時回應，您的原始文字已保留。");
                    } else {
                        input.value = rewritten;
                        addHistoryItem(rewritten);
                    }
                } else {
                    const errDetail = data.error ? (data.error.message || JSON.stringify(data.error)) : "無法重寫文字";
                    showToast("⚠️ 重寫失敗: " + errDetail + " (原始文字已保留)");
                }
            } catch (err) {
                showToast("⚠️ 網路錯誤或 Worker 無法連線，原始文字已保留。");
            } finally {
                rewriteBtn.disabled = false;
                rewriteBtn.innerHTML = "AI 重寫<br><span style='font-size:10px; opacity:0.8;'>Rewrite</span>";
            }
        }

        function addHistoryItem(text) {
            if (!text) return;
            historyItems.unshift({ id: Date.now(), text: text });
            saveHistory();
            renderHistory();
        }

        function saveHistory() {
            localStorage.setItem('saved_history_items', JSON.stringify(historyItems));
        }

        function renderHistory() {
            historyListEl.innerHTML = '';
            if (historyItems.length === 0) {
                historyListEl.innerHTML = '<div style="font-size:12px; opacity:0.6;">無紀錄 (No history)</div>';
                return;
            }

            historyItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <input type="checkbox" data-id="${item.id}">
                    <span class="history-text" onclick="loadHistoryToInput('${escapeHtml(item.text)}')">${escapeHtml(item.text)}</span>
                `;
                historyListEl.appendChild(div);
            });
        }

        function loadHistoryToInput(text) {
            isFirstInput = false;
            input.value = text;
        }

        function mergeSelectedHistory() {
            const checkboxes = historyListEl.querySelectorAll('input[type="checkbox"]:checked');
            const selectedIds = Array.from(checkboxes).map(cb => parseInt(cb.getAttribute('data-id')));

            if (selectedIds.length < 2) {
                showToast("請至少選擇兩個紀錄進行合併");
                return;
            }

            const selectedItems = historyItems.filter(item => selectedIds.includes(item.id));
            const mergedText = selectedItems.map(item => item.text).join(" ");

            addHistoryItem(mergedText);
            isFirstInput = false;
            input.value = mergedText;
        }

        function deleteSelectedHistory() {
            const checkboxes = historyListEl.querySelectorAll('input[type="checkbox"]:checked');
            const selectedIds = Array.from(checkboxes).map(cb => parseInt(cb.getAttribute('data-id')));

            if (selectedIds.length === 0) {
                showToast("請選擇要刪除的紀錄");
                return;
            }

            historyItems = historyItems.filter(item => !selectedIds.includes(item.id));
            saveHistory();
            renderHistory();
        }

        function clearText() {
            isFirstInput = false;
            input.value = '';
            input.focus();
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "&#39;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>

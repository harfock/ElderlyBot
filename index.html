<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elderly Reader - Big Text</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #121212;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .config-panel {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .config-panel input {
            flex: 1;
            padding: 8px 12px;
            background: #2C2C2E;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            flex: 1;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-rewrite {
            background-color: #007AFF;
            color: white;
        }

        .btn-clear {
            background-color: #3A3A3C;
            color: white;
            flex: 0.3;
        }

        /* Displays 8 characters per row */
        #big-text-input {
            width: 100%;
            flex-grow: 1;
            background-color: #1C1C1E;
            color: #FFCC00;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 10px;
            font-size: calc((100vw - 30px) / 8);
            line-height: 1.3;
            resize: none;
            outline: none;
            word-break: break-all;
        }

        #big-text-input::placeholder {
            color: #555555;
        }
    </style>
</head>
<body>

    <div class="config-panel">
        <input type="password" id="api-key" placeholder="Enter OpenRouter API Key (sk-or-...)">
    </div>

    <div class="controls">
        <button id="rewrite-btn" class="btn-rewrite" onclick="handleRewrite()">Rewrite with AI</button>
        <button class="btn-clear" onclick="clearText()">Clear</button>
    </div>

    <textarea id="big-text-input" placeholder="請在此輸入文字..."></textarea>

    <script>
        // REPLACE WITH YOUR CLOUDFLARE WORKER URL
        const WORKER_URL = "https://openai-proxy.tinycarton.workers.dev/";

        const input = document.getElementById('big-text-input');
        const apiKeyInput = document.getElementById('api-key');
        const rewriteBtn = document.getElementById('rewrite-btn');

        if (localStorage.getItem('openrouter_key')) {
            apiKeyInput.value = localStorage.getItem('openrouter_key');
        }

        apiKeyInput.addEventListener('change', () => {
            localStorage.setItem('openrouter_key', apiKeyInput.value.trim());
        });

        async function handleRewrite() {
            const rawText = input.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!rawText) return;

            if (!apiKey) {
                alert("Please enter your OpenRouter API key.");
                return;
            }

            rewriteBtn.disabled = true;
            rewriteBtn.textContent = "Rewriting...";

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        text: rawText,
                        apiKey: apiKey
                    })
                });

                const data = await response.json();

                if (data.choices && data.choices[0]) {
                    input.value = data.choices[0].message.content.trim();
                } else if (data.error) {
                    alert("Error: " + (data.error.message || JSON.stringify(data.error)));
                } else {
                    alert("Unable to process text. Check your API key.");
                }
            } catch (err) {
                alert("Network Error: Verify your Cloudflare Worker URL.");
            } finally {
                rewriteBtn.disabled = false;
                rewriteBtn.textContent = "Rewrite with AI";
            }
        }

        function clearText() {
            input.value = '';
            input.focus();
        }
    </script>
</body>
</html>

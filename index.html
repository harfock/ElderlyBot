<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warm Reader - HK Communication & Voice Assistant</title>
    <style>
        :root {
            /* Dynamic Theme Variables - Dark Amber (Default) */
            --paper-bg: #1C1A17; 
            --paper-line-color: rgba(226, 157, 50, 0.18); 
            --margin-line-color: rgba(224, 109, 83, 0.35); 
            --text-color: #FFD166; 
            --ui-text: #F4EAD4; 
            --card-bg: rgba(36, 32, 28, 0.92);
            --punc-btn-bg: linear-gradient(145deg, #3A332C, #2A241F);
            --punc-text-color: #FFD166;
            --btn-warm-primary: linear-gradient(145deg, #E06D53, #C85237); 
            --btn-warm-secondary: linear-gradient(145deg, #4A423A, #36302A); 
            --border-color: rgba(226, 157, 50, 0.2);
            --chars-per-row: 8;
            --line-height-px: 64px;
        }

        /* Theme: Aged Parchment */
        body.theme-aged-parchment {
            --paper-bg: #2C261E;
            --text-color: #FFE8B6;
            --ui-text: #FFF8E7;
            --paper-line-color: rgba(255, 220, 150, 0.15);
            --card-bg: rgba(44, 38, 30, 0.92);
            --punc-btn-bg: linear-gradient(145deg, #42382C, #2F271E);
            --punc-text-color: #FFE8B6;
            --btn-warm-secondary: linear-gradient(145deg, #4A4034, #362E25);
        }

        /* Theme: Cream Paper (Light Mode) */
        body.theme-cream-paper {
            --paper-bg: #FFF8EB;
            --text-color: #2A1F13;
            --ui-text: #2A1F13;
            --paper-line-color: rgba(180, 130, 60, 0.2);
            --margin-line-color: rgba(200, 70, 50, 0.3);
            --card-bg: rgba(245, 235, 218, 0.95);
            --punc-btn-bg: linear-gradient(145deg, #EADBC8, #D5C3A9);
            --punc-text-color: #2A1F13;
            --btn-warm-primary: linear-gradient(145deg, #D95338, #B83A20);
            --btn-warm-secondary: linear-gradient(145deg, #E2D1BC, #C8B59E);
            --border-color: rgba(180, 130, 60, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--paper-bg);
            background-image: 
                linear-gradient(90deg, transparent 85px, var(--margin-line-color) 85px, var(--margin-line-color) 87px, transparent 87px),
                linear-gradient(var(--paper-line-color) 1.5px, transparent 1.5px);
            background-size: 100% 100%, 100% var(--line-height-px);
            background-position: 0 0, 0 16px;
            color: var(--ui-text);
            display: flex;
            flex-direction: column;
            padding: 20px 20px 20px 105px; 
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        .btn-3d {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--ui-text);
            font-weight: bold;
            cursor: pointer;
            outline: none;
            user-select: none;
            box-shadow: 
                0 4px 0 rgba(0, 0, 0, 0.25),
                0 6px 10px rgba(0, 0, 0, 0.15),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.2s;
        }

        .btn-3d:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .btn-3d:active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 rgba(0, 0, 0, 0.2),
                inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Left Sidebar - Responsive Auto-Fitting */
        .punctuation-sidebar {
            position: fixed;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            width: 82px;
            max-height: 96vh;
            max-height: 96dvh;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            z-index: 1000;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .punctuation-sidebar::-webkit-scrollbar {
            width: 3px;
        }
        .punctuation-sidebar::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .punctuation-sidebar.collapsed {
            width: 24px;
        }

        .sidebar-toggle-btn {
            background: transparent;
            border: none;
            color: var(--ui-text);
            cursor: pointer;
            font-size: 12px;
            padding: 2px;
            transition: transform 0.3s;
        }

        .punctuation-sidebar.collapsed .sidebar-toggle-btn {
            transform: rotate(180deg);
        }

        .sidebar-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            align-items: center;
            transition: opacity 0.2s;
        }

        .punctuation-sidebar.collapsed .sidebar-content {
            opacity: 0;
            pointer-events: none;
        }

        .btn-sidebar-action {
            width: 100%;
            padding: 6px 2px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.1;
            text-align: center;
            flex-shrink: 0;
        }

        .btn-sidebar-rewrite {
            background: var(--btn-warm-primary);
            color: #FFF8E7;
        }

        .btn-sidebar-utility {
            background: var(--btn-warm-secondary);
        }

        .sidebar-divider {
            width: 85%;
            height: 1px;
            background: var(--border-color);
            margin: 2px 0;
            flex-shrink: 0;
        }

        .punc-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            align-items: center;
        }

        .btn-punc {
            width: 48px;
            height: 36px;
            font-size: 17px;
            background: var(--punc-btn-bg);
            color: var(--punc-text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        @media (max-height: 700px) {
            .btn-sidebar-action {
                padding: 4px 1px;
                font-size: 11px;
            }
            .btn-punc {
                height: 30px;
                font-size: 15px;
            }
        }

        /* Right Settings Sidebar */
        .right-sidebar {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 320px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-left: 1px solid var(--border-color);
            padding: 60px 18px 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 999;
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
            overflow-y: auto;
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.4);
        }

        .right-sidebar.open {
            transform: translateX(0);
        }

        .right-toggle-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1001;
            padding: 10px 16px;
            background: var(--btn-warm-secondary);
            font-size: 14px;
        }

        .setting-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-section h3 {
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
            color: var(--ui-text);
        }

        .font-adjuster {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.1);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .btn-step {
            width: 34px;
            height: 34px;
            font-size: 18px;
            background: var(--btn-warm-secondary);
        }

        .select-theme, .input-api {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
            color: var(--ui-text);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .history-actions {
            display: flex;
            gap: 8px;
        }

        .btn-hist-action {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }

        .btn-merge { background: linear-gradient(145deg, #2E7D32, #1B5E20); color: white; }
        .btn-delete { background: linear-gradient(145deg, #C62828, #8E0000); color: white; }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            background: rgba(0,0,0,0.08);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid var(--border-color);
        }

        .history-item input[type="checkbox"] {
            margin-top: 3px;
            transform: scale(1.2);
        }

        .history-text {
            flex: 1;
            cursor: pointer;
            word-break: break-all;
        }

        /* Main Workspace */
        .main-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            width: 100%;
        }

        .instruction-banner {
            font-size: 13px;
            color: var(--ui-text);
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            line-height: 1.4;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: 120px;
        }

        #big-text-input {
            width: 100%;
            flex-grow: 1;
            min-height: 60vh;
            background: transparent;
            color: var(--text-color);
            border: none;
            padding: 0;
            margin-top: calc(var(--line-height-px) * 0.1);
            font-size: clamp(20px, calc((100vw - 160px) / var(--chars-per-row)), 72px);
            line-height: var(--line-height-px);
            resize: none;
            outline: none;
            word-break: break-all;
            font-family: inherit;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #big-text-input::placeholder {
            color: var(--text-color);
            opacity: 0.4;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(36, 32, 28, 0.95);
            color: var(--ui-text);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none;
            z-index: 2000;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 10px 15px 75px;
            }
            .punctuation-sidebar {
                left: 4px;
                width: 68px;
            }
            .btn-punc {
                width: 40px;
            }
            .instruction-banner {
                margin-right: 0;
                margin-top: 45px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body class="theme-warm-amber">

    <div id="toast" class="toast"></div>

    <!-- Left Floating Sidebar -->
    <aside id="left-sidebar" class="punctuation-sidebar">
        <button class="sidebar-toggle-btn" onclick="toggleLeftSidebar()" title="Collapse/Expand">◄</button>
        
        <div class="sidebar-content">
            <button id="rewrite-btn" class="btn-3d btn-sidebar-action btn-sidebar-rewrite" onclick="handleRewrite()">
                AI 重寫<br><span style="font-size:9px; opacity:0.8;">Rewrite</span>
            </button>

            <button class="btn-3d btn-sidebar-action btn-sidebar-utility" onclick="copyText()">
                複製<br><span style="font-size:9px; opacity:0.8;">Copy</span>
            </button>

            <button class="btn-3d btn-sidebar-action btn-sidebar-utility" onclick="pasteText()">
                貼上<br><span style="font-size:9px; opacity:0.8;">Paste</span>
            </button>

            <button class="btn-3d btn-sidebar-action btn-sidebar-utility" onclick="clearText()">
                清除<br><span style="font-size:9px; opacity:0.8;">Clear</span>
            </button>

            <div class="sidebar-divider"></div>

            <div class="punc-group">
                <button class="btn-3d btn-punc" onclick="insertPunctuation('，')">，</button>
                <button class="btn-3d btn-punc" onclick="insertPunctuation('。')">。</button>
                <button class="btn-3d btn-punc" onclick="insertPunctuation('？')">？</button>
                <button class="btn-3d btn-punc" onclick="insertPunctuation('！')">！</button>
                <button class="btn-3d btn-punc" onclick="insertPunctuation('：')">：</button>
                <button class="btn-3d btn-punc" onclick="insertPunctuation('；')">；</button>
                <button class="btn-3d btn-punc" onclick="insertPunctuation('「')">「</button>
                <button class="btn-3d btn-punc" onclick="insertPunctuation('」')">」</button>
                <button class="btn-3d btn-punc" onclick="insertPunctuation('、')">、</button>
            </div>
        </div>
    </aside>

    <button class="btn-3d right-toggle-btn" onclick="toggleRightSidebar()">⚙ 設定 Settings</button>

    <!-- Right Settings Drawer -->
    <aside id="right-sidebar" class="right-sidebar">
        <div class="setting-section">
            <h3>API 金鑰 (API Key)</h3>
            <input type="password" id="api-key" class="input-api" placeholder="Enter OpenRouter API Key">
        </div>

        <div class="setting-section">
            <h3>語氣風格 (Tone Preset)</h3>
            <select id="tone-select" class="select-theme">
                <option value="preserve">保持原意 (Preserve Original)</option>
                <option value="polish">修飾流暢 (Polished & Formal)</option>
                <option value="warm">溫和親切 (Warm & Conversational)</option>
            </select>
        </div>

        <div class="setting-section">
            <h3>廣東話語音過濾 (HK Cantonese Filter)</h3>
            <select id="filter-select" class="select-theme">
                <option value="hk_clean">廣東話口語（清除口吃 / 「即係」贅字）</option>
                <option value="hk_to_written">轉為標準書面語（適合正式訊息 / 電郵）</option>
                <option value="voice_stutter">僅修復重複字詞（保留完全原音）</option>
                <option value="none">不使用過濾器 (No Filter)</option>
            </select>
            <span style="font-size:11px; opacity:0.75; margin-top:2px;">
                💡 提示：「轉為標準書面語」已包含贅字與口吃修復功能。
            </span>
        </div>

        <div class="setting-section">
            <h3>點列/條理化 (Point-Form Style)</h3>
            <select id="pointform-select" class="select-theme">
                <option value="smart_bullet">智能列點 Bullet Points (•)</option>
                <option value="smart_number">數字列點 Numbered List (1, 2, 3)</option>
                <option value="smart_step">步驟流程 Step-by-Step Flow</option>
                <option value="off">關閉 Off (Paragraphs)</option>
            </select>
        </div>

        <div class="setting-section">
            <h3>字體大小 (Font Size)</h3>
            <div class="font-adjuster">
                <span>每行字數 Chars/Row:</span>
                <div>
                    <button class="btn-3d btn-step" onclick="changeFontSize(1)">+</button>
                    <span id="chars-display" style="margin: 0 6px; font-weight: bold;">8</span>
                    <button class="btn-3d btn-step" onclick="changeFontSize(-1)">-</button>
                </div>
            </div>
        </div>

        <div class="setting-section">
            <h3>配色主題 (Theme)</h3>
            <select id="theme-select" class="select-theme" onchange="applyTheme(this.value)">
                <option value="theme-warm-amber">溫暖琥珀 (Warm Amber)</option>
                <option value="theme-aged-parchment">復古羊皮紙 (Aged Parchment)</option>
                <option value="theme-cream-paper">柔和奶油白 (Warm Cream Daylight)</option>
            </select>
        </div>

        <div class="setting-section">
            <h3>歷史紀錄 (History)</h3>
            <div class="history-actions">
                <button class="btn-3d btn-hist-action btn-merge" onclick="mergeSelectedHistory()">合併選取</button>
                <button class="btn-3d btn-hist-action btn-delete" onclick="deleteSelectedHistory()">刪除選取</button>
            </div>
            <div id="history-list" class="history-list"></div>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-container">
        <div class="instruction-banner">
            💡 <span>點擊下方輸入框輸入文字或貼上語音轉譯，側邊欄可進行 AI 重寫、廣東話淨化與點列化。</span>
        </div>

        <textarea id="big-text-input" placeholder="請在此輸入文字..."></textarea>
    </main>

    <script>
        const WORKER_URL = "https://openrouter-proxy.tinycarton.workers.dev/";

        const input = document.getElementById('big-text-input');
        const apiKeyInput = document.getElementById('api-key');
        const rewriteBtn = document.getElementById('rewrite-btn');
        const historyListEl = document.getElementById('history-list');
        const toastEl = document.getElementById('toast');
        const toneSelect = document.getElementById('tone-select');
        const filterSelect = document.getElementById('filter-select');

        const TONE_BASE = {
            preserve: "Keep original words and intent intact while fixing typos, missing punctuation, and minor awkwardness.",
            polish: "Elevate vocabulary, refine sentence structure, remove awkward phrasing, and format into polished Chinese.",
            warm: "Rewrite to sound empathetic, approachable, respectful, and polite."
        };

        const CANTONESE_FILTERS = {
            hk_clean: `
[HK CANTONESE SPEECH CLEANUP]
- Process raw Hong Kong spoken Cantonese (廣東話口語).
- REMOVE VOICE FILLERS & HESITATIONS: Strip words like '呃', '即係', '咁即係', '呢個呢個', '諗住', '你知啦', '咁樣' when used purely as speech hesitation.
- RESOLVE SELF-CORRECTIONS: If speaker self-corrects mid-sentence (e.g., '兩點... 唔係, 三點先啱'), retain ONLY the final intended statement ('三點').
- REMOVE DUPLICATED WORDS: Collapse accidental repeats caused by voice-to-text lag.
- RETAIN authentic HK Cantonese phrasing without converting to standard written Chinese unless requested.
            `,
            hk_to_written: `
[CANTONESE TO FORMAL WRITTEN CHINESE]
- Convert spoken HK Cantonese into clean, standard formal written Chinese (書面語).
- Convert Cantonese vocabulary to written Chinese (e.g., '聽日' -> '明天', '佢地' -> '他們', '睇下' -> '查看', '幾多' -> '多少').
- Remove all spoken hesitations, stutters, and filler words.
            `,
            voice_stutter: `
[STUTTER & REPETITION FILTER]
- Focus strictly on cleaning speech-to-text duplication, stutters, and audio lag repeats.
- Do not alter word choices or style beyond removing accidental repetitive noise.
            `,
            none: ""
        };

        const POINT_FORM_RULES = {
            smart_bullet: `
[SMART POINT-FORM FORMATTING]
- Evaluate the text's structure.
- IF text contains multiple distinct points, tasks, steps, concepts, or long sentences: convert into a bulleted list using '• '.
- IF text is a single brief reminder or simple short sentence: keep as a clear single line without forcing unnecessary bullet points.
            `,
            smart_number: `
[NUMBERED LIST FORMATTING]
- IF text contains sequential steps, multiple items, or distinct points: format into a numbered list (1. 2. 3.).
- IF text is a simple brief phrase: keep as a single clear sentence.
            `,
            smart_step: `
[STEP-BY-STEP FLOW]
- Format complex ideas or multiple instructions into structured operational steps (例如：步驟一：... 步驟二：...).
            `,
            off: "Maintain original paragraph layout without converting to point form."
        };

        let charsPerRow = parseInt(localStorage.getItem('saved_chars_per_row')) || 8;
        let historyItems = JSON.parse(localStorage.getItem('saved_history_items')) || [];
        let isFirstInput = true;

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('openrouter_key')) {
                apiKeyInput.value = localStorage.getItem('openrouter_key');
            }

            const savedTheme = localStorage.getItem('saved_theme') || 'theme-warm-amber';
            document.getElementById('theme-select').value = savedTheme;
            applyTheme(savedTheme);

            updateFontCSS();
            renderHistory();

            // Setup Approach 1 Dynamic UI Conflict Resolution
            setupConflictResolution();
        });

        function setupConflictResolution() {
            filterSelect.addEventListener('change', () => {
                if (filterSelect.value === 'hk_to_written' && toneSelect.value === 'preserve') {
                    toneSelect.value = 'polish';
                    showToast("💡 已自動切換至「修飾流暢」以配合書面語轉換");
                }
            });

            toneSelect.addEventListener('change', () => {
                if (toneSelect.value === 'preserve' && filterSelect.value === 'hk_to_written') {
                    filterSelect.value = 'hk_clean';
                    showToast("💡 已自動切換至「廣東話口語」以保留原始用語");
                }
            });
        }

        input.addEventListener('focus', handleInitialClear);
        input.addEventListener('input', handleInitialClear);

        function handleInitialClear() {
            if (isFirstInput) {
                isFirstInput = false;
                if (input.value === "請在此輸入文字...") {
                    input.value = "";
                }
            }
        }

        apiKeyInput.addEventListener('change', () => {
            localStorage.setItem('openrouter_key', apiKeyInput.value.trim());
        });

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.style.display = 'block';
            setTimeout(() => { toastEl.style.display = 'none'; }, 3000);
        }

        function toggleLeftSidebar() {
            document.getElementById('left-sidebar').classList.toggle('collapsed');
        }

        function toggleRightSidebar() {
            document.getElementById('right-sidebar').classList.toggle('open');
        }

        function changeFontSize(delta) {
            charsPerRow = Math.max(4, Math.min(16, charsPerRow - delta));
            localStorage.setItem('saved_chars_per_row', charsPerRow);
            updateFontCSS();
        }

        function updateFontCSS() {
            document.documentElement.style.setProperty('--chars-per-row', charsPerRow);
            document.getElementById('chars-display').textContent = charsPerRow;
        }

        function applyTheme(themeClass) {
            document.body.className = themeClass;
            localStorage.setItem('saved_theme', themeClass);
        }

        function insertPunctuation(char) {
            handleInitialClear();
            input.focus();
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;

            input.value = text.substring(0, start) + char + text.substring(end);
            input.selectionStart = input.selectionEnd = start + char.length;
        }

        async function copyText() {
            const textToCopy = input.value;
            if (!textToCopy.trim()) {
                showToast("⚠️ 目前沒有文字可複製");
                return;
            }

            try {
                await navigator.clipboard.writeText(textToCopy);
                showToast("📋 已成功複製全部文字");
            } catch (err) {
                input.select();
                document.execCommand('copy');
                showToast("📋 已複製全部文字");
            }
        }

        async function pasteText() {
            try {
                const textFromClipboard = await navigator.clipboard.readText();
                if (!textFromClipboard) {
                    showToast("⚠️ 剪貼簿為空");
                    return;
                }

                handleInitialClear();
                input.focus();

                const start = input.selectionStart;
                const end = input.selectionEnd;
                const currentText = input.value;

                input.value = currentText.substring(0, start) + textFromClipboard + currentText.substring(end);
                input.selectionStart = input.selectionEnd = start + textFromClipboard.length;

                showToast("📥 已貼上剪貼簿內容");
            } catch (err) {
                showToast("⚠️ 無法讀取剪貼簿，請使用手動貼上");
            }
        }

        function constructSystemPrompt() {
            const toneKey = toneSelect.value;
            const filterKey = filterSelect.value;
            const pointFormKey = document.getElementById('pointform-select').value;

            return `
You are an expert communication assistant designed for Hong Kong Cantonese users and clear text refinement.

[CORE OBJECTIVE]
Transform raw, dictated, or typed Chinese input into clean, structured, and easy-to-read text.

[TONE INSTRUCTION]
${TONE_BASE[toneKey] || TONE_BASE.preserve}

${CANTONESE_FILTERS[filterKey] || ""}

${POINT_FORM_RULES[pointFormKey] || ""}

[OUTPUT STYLING RULES]
- Output ONLY the final processed text.
- Do NOT add introductory greetings, robotic meta-announcements, explanations, or quotes around output.
- Keep output clear, natural, and accessible.
            `.trim();
        }

        async function handleRewrite() {
            const rawText = input.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!rawText) return;

            if (!apiKey) {
                showToast("請在右側設定欄輸入 OpenRouter API Key");
                toggleRightSidebar();
                return;
            }

            rewriteBtn.disabled = true;
            rewriteBtn.innerHTML = "重寫中...<br><span style='font-size:9px;'>Rewriting</span>";

            const combinedSystemPrompt = constructSystemPrompt();

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        text: rawText,
                        apiKey: apiKey,
                        systemPrompt: combinedSystemPrompt
                    })
                });

                const data = await response.json();

                if (data.choices && data.choices[0] && data.choices[0].message) {
                    const rewritten = data.choices[0].message.content.trim();
                    
                    if (rewritten.toLowerCase().includes("user safety") || rewritten.startsWith("Safety:")) {
                        showToast("⚠️ 重寫失敗：觸發 AI 安全過濾機制，您的原始文字已保留。");
                    } else {
                        input.value = rewritten;
                        addHistoryItem(rewritten);
                    }
                } else {
                    const errDetail = data.error ? (data.error.message || JSON.stringify(data.error)) : "無法重寫文字";
                    showToast("⚠️ 重寫失敗: " + errDetail + " (原始文字已保留)");
                }
            } catch (err) {
                showToast("⚠️ 網路錯誤或 Worker 無法連線，原始文字已保留。");
            } finally {
                rewriteBtn.disabled = false;
                rewriteBtn.innerHTML = "AI 重寫<br><span style='font-size:9px; opacity:0.8;'>Rewrite</span>";
            }
        }

        function addHistoryItem(text) {
            if (!text) return;
            historyItems.unshift({ id: Date.now(), text: text });
            saveHistory();
            renderHistory();
        }

        function saveHistory() {
            localStorage.setItem('saved_history_items', JSON.stringify(historyItems));
        }

        function renderHistory() {
            historyListEl.innerHTML = '';
            if (historyItems.length === 0) {
                historyListEl.innerHTML = '<div style="font-size:12px; opacity:0.6;">無紀錄 (No history)</div>';
                return;
            }

            historyItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <input type="checkbox" data-id="${item.id}">
                    <span class="history-text" onclick="loadHistoryToInput('${escapeHtml(item.text)}')">${escapeHtml(item.text)}</span>
                `;
                historyListEl.appendChild(div);
            });
        }

        function loadHistoryToInput(text) {
            isFirstInput = false;
            input.value = text;
        }

        function mergeSelectedHistory() {
            const checkboxes = historyListEl.querySelectorAll('input[type="checkbox"]:checked');
            const selectedIds = Array.from(checkboxes).map(cb => parseInt(cb.getAttribute('data-id')));

            if (selectedIds.length < 2) {
                showToast("請至少選擇兩個紀錄進行合併");
                return;
            }

            const selectedItems = historyItems.filter(item => selectedIds.includes(item.id));
            const mergedText = selectedItems.map(item => item.text).join("\n\n");

            addHistoryItem(mergedText);
            isFirstInput = false;
            input.value = mergedText;
        }

        function deleteSelectedHistory() {
            const checkboxes = historyListEl.querySelectorAll('input[type="checkbox"]:checked');
            const selectedIds = Array.from(checkboxes).map(cb => parseInt(cb.getAttribute('data-id')));

            if (selectedIds.length === 0) {
                showToast("請選擇要刪除的紀錄");
                return;
            }

            historyItems = historyItems.filter(item => !selectedIds.includes(item.id));
            saveHistory();
            renderHistory();
        }

        function clearText() {
            isFirstInput = false;
            input.value = '';
            input.focus();
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "&#39;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>

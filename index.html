<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elderly Reader - Big Text AI</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1C1C1E;
            --text-color: #FFCC00;
            --ui-text: #FFFFFF;
            --btn-bg: #3A3A3C;
            --border-color: #333333;
            --accent-color: #007AFF;
            --chars-per-row: 8;
        }

        /* Color Themes */
        body.theme-yellow-black {
            --bg-color: #121212;
            --card-bg: #1C1C1E;
            --text-color: #FFCC00;
            --ui-text: #FFFFFF;
            --btn-bg: #2C2C2E;
            --border-color: #444;
        }
        body.theme-white-black {
            --bg-color: #000000;
            --card-bg: #181818;
            --text-color: #FFFFFF;
            --ui-text: #FFFFFF;
            --btn-bg: #333333;
            --border-color: #555;
        }
        body.theme-black-yellow {
            --bg-color: #FFD700;
            --card-bg: #FFEA70;
            --text-color: #000000;
            --ui-text: #000000;
            --btn-bg: #E6C200;
            --border-color: #B39700;
        }
        body.theme-cyan-black {
            --bg-color: #050B14;
            --card-bg: #0D1B2A;
            --text-color: #00E5FF;
            --ui-text: #FFFFFF;
            --btn-bg: #1B263B;
            --border-color: #415A77;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--ui-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Floating Sidebar Toggle Buttons */
        .sidebar-toggle {
            position: fixed;
            top: 15px;
            z-index: 1000;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #left-toggle { left: 15px; }
        #right-toggle { right: 15px; }

        /* Sidebars Common */
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 280px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            z-index: 999;
            padding: 60px 15px 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: transform 0.3s ease-in-out;
            overflow-y: auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.7);
        }

        .sidebar h3 {
            font-size: 18px;
            margin-bottom: 5px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        /* Left Sidebar: Punctuation */
        #left-sidebar {
            left: 0;
            transform: translateX(-100%);
        }
        #left-sidebar.open {
            transform: translateX(0);
        }

        .punctuation-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .punc-btn {
            background: var(--btn-bg);
            color: var(--ui-text);
            border: 1px solid var(--border-color);
            font-size: 24px;
            font-weight: bold;
            padding: 12px 0;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        .punc-btn:active {
            opacity: 0.7;
        }

        /* Right Sidebar: Settings & History */
        #right-sidebar {
            right: 0;
            transform: translateX(100%);
        }
        #right-sidebar.open {
            transform: translateX(0);
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .font-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--btn-bg);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .font-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .theme-select {
            padding: 8px;
            background: var(--btn-bg);
            color: var(--ui-text);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        /* History Items */
        .history-controls {
            display: flex;
            gap: 8px;
        }

        .btn-hist-action {
            flex: 1;
            padding: 8px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-merge { background: #34C759; color: white; }
        .btn-delete { background: #FF3B30; color: white; }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            background: var(--btn-bg);
            padding: 8px;
            border-radius: 6px;
            font-size: 14px;
            border: 1px solid var(--border-color);
        }

        .history-item input[type="checkbox"] {
            margin-top: 3px;
            transform: scale(1.2);
        }

        .history-text {
            flex: 1;
            cursor: pointer;
            word-break: break-all;
        }

        /* Main Application Layout */
        .main-content {
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            gap: 10px;
        }

        .config-panel {
            display: flex;
            gap: 10px;
        }

        .config-panel input {
            flex: 1;
            padding: 8px 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--ui-text);
            border-radius: 6px;
            font-size: 14px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-rewrite {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-clear {
            background-color: var(--btn-bg);
            color: var(--ui-text);
            flex: 0.3;
            border: 1px solid var(--border-color);
        }

        /* Dynamic Font Sizing based on chars-per-row */
        #big-text-input {
            width: 100%;
            flex-grow: 1;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            font-size: calc((100vw - 40px) / var(--chars-per-row));
            line-height: 1.3;
            resize: none;
            outline: none;
            word-break: break-all;
            transition: background-color 0.3s, color 0.3s;
        }

        #big-text-input::placeholder {
            color: #666;
        }
    </style>
</head>
<body class="theme-yellow-black">

    <!-- Sidebar Toggles -->
    <button id="left-toggle" class="sidebar-toggle" onclick="toggleSidebar('left')">標點 Punctuation</button>
    <button id="right-toggle" class="sidebar-toggle" onclick="toggleSidebar('right')">設定 Settings</button>

    <!-- Left Sidebar: Preset Punctuation Marks -->
    <div id="left-sidebar" class="sidebar">
        <h3>常用標點 (Punctuation)</h3>
        <div class="punctuation-grid">
            <button class="punc-btn" onclick="insertPunctuation('，')">，</button>
            <button class="punc-btn" onclick="insertPunctuation('。')">。</button>
            <button class="punc-btn" onclick="insertPunctuation('？')">？</button>
            <button class="punc-btn" onclick="insertPunctuation('！')">！</button>
            <button class="punc-btn" onclick="insertPunctuation('：')">：</button>
            <button class="punc-btn" onclick="insertPunctuation('；')">；</button>
            <button class="punc-btn" onclick="insertPunctuation('「')">「</button>
            <button class="punc-btn" onclick="insertPunctuation('」')">」</button>
            <button class="punc-btn" onclick="insertPunctuation('、')">、</button>
        </div>
    </div>

    <!-- Right Sidebar: Settings & History -->
    <div id="right-sidebar" class="sidebar">
        <h3>字體大小 (Font Size)</h3>
        <div class="setting-group">
            <div class="font-controls">
                <span>每行字數 Characters/Row:</span>
                <div>
                    <button class="font-btn" onclick="changeFontSize(1)">+</button>
                    <span id="chars-display" style="font-size: 16px; margin: 0 6px;">8</span>
                    <button class="font-btn" onclick="changeFontSize(-1)">-</button>
                </div>
            </div>
        </div>

        <h3>配色主題 (Color Theme)</h3>
        <div class="setting-group">
            <select id="theme-select" class="theme-select" onchange="applyTheme(this.value)">
                <option value="theme-yellow-black">黃字黑底 (Yellow on Black)</option>
                <option value="theme-white-black">白字黑底 (White on Black)</option>
                <option value="theme-black-yellow">黑字黃底 (Black on Yellow)</option>
                <option value="theme-cyan-black">青字黑底 (Cyan on Black)</option>
            </select>
        </div>

        <h3>紀錄 (History)</h3>
        <div class="history-controls">
            <button class="btn-hist-action btn-merge" onclick="mergeSelectedHistory()">合併選取 Merge</button>
            <button class="btn-hist-action btn-delete" onclick="deleteSelectedHistory()">刪除選取 Delete</button>
        </div>
        <div id="history-list" class="history-list">
            <!-- Dynamic history items -->
        </div>
    </div>

    <!-- Main Web App -->
    <div class="main-content">
        <div class="config-panel">
            <input type="password" id="api-key" placeholder="Enter OpenRouter API Key (sk-or-...)">
        </div>

        <div class="controls">
            <button id="rewrite-btn" class="action-btn btn-rewrite" onclick="handleRewrite()">Rewrite with AI</button>
            <button class="action-btn btn-clear" onclick="clearText()">Clear</button>
        </div>

        <textarea id="big-text-input" placeholder="請在此輸入文字..."></textarea>
    </div>

    <script>
        // PASTE YOUR CLOUDFLARE WORKER URL HERE
        const WORKER_URL = "https://openrouter-proxy.YOUR-SUBDOMAIN.workers.dev";

        const input = document.getElementById('big-text-input');
        const apiKeyInput = document.getElementById('api-key');
        const rewriteBtn = document.getElementById('rewrite-btn');
        const historyListEl = document.getElementById('history-list');

        let charsPerRow = parseInt(localStorage.getItem('saved_chars_per_row')) || 8;
        let historyItems = JSON.parse(localStorage.getItem('saved_history_items')) || [];

        // Initialize Settings
        document.addEventListener('DOMContentLoaded', () => {
            // Load saved API Key
            if (localStorage.getItem('openrouter_key')) {
                apiKeyInput.value = localStorage.getItem('openrouter_key');
            }

            // Load saved Theme
            const savedTheme = localStorage.getItem('saved_theme') || 'theme-yellow-black';
            document.getElementById('theme-select').value = savedTheme;
            applyTheme(savedTheme);

            // Load saved Font Size
            updateFontCSS();

            // Load History
            renderHistory();
        });

        apiKeyInput.addEventListener('change', () => {
            localStorage.setItem('openrouter_key', apiKeyInput.value.trim());
        });

        // Sidebar Navigation Toggles
        function toggleSidebar(side) {
            const left = document.getElementById('left-sidebar');
            const right = document.getElementById('right-sidebar');

            if (side === 'left') {
                left.classList.toggle('open');
                right.classList.remove('open');
            } else {
                right.classList.toggle('open');
                left.classList.remove('open');
            }
        }

        // Font Size Adjuster (+ / - Controls Characters per Row)
        function changeFontSize(delta) {
            // Adjust character count per row between 4 and 16
            charsPerRow = Math.max(4, Math.min(16, charsPerRow - delta));
            localStorage.setItem('saved_chars_per_row', charsPerRow);
            updateFontCSS();
        }

        function updateFontCSS() {
            document.documentElement.style.setProperty('--chars-per-row', charsPerRow);
            document.getElementById('chars-display').textContent = charsPerRow;
        }

        // Theme Switcher
        function applyTheme(themeClass) {
            document.body.className = themeClass;
            localStorage.setItem('saved_theme', themeClass);
        }

        // Quick Punctuation Inserter
        function insertPunctuation(char) {
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;

            input.value = text.substring(0, start) + char + text.substring(end);
            input.focus();
            input.selectionStart = input.selectionEnd = start + char.length;
        }

        // AI Request Handler
        async function handleRewrite() {
            const rawText = input.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!rawText) return;

            if (!apiKey) {
                alert("Please enter your OpenRouter API key.");
                return;
            }

            rewriteBtn.disabled = true;
            rewriteBtn.textContent = "Rewriting...";

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        text: rawText,
                        apiKey: apiKey
                    })
                });

                const data = await response.json();

                if (data.choices && data.choices[0]) {
                    const rewritten = data.choices[0].message.content.trim();
                    input.value = rewritten;
                    addHistoryItem(rewritten);
                } else if (data.error) {
                    alert("Error: " + (data.error.message || JSON.stringify(data.error)));
                } else {
                    alert("Unable to process text. Please check your API key.");
                }
            } catch (err) {
                alert("Network Error: Verify your Cloudflare Worker URL.");
            } finally {
                rewriteBtn.disabled = false;
                rewriteBtn.textContent = "Rewrite with AI";
            }
        }

        // History Management Functions
        function addHistoryItem(text) {
            if (!text) return;
            historyItems.unshift({ id: Date.now(), text: text });
            saveHistory();
            renderHistory();
        }

        function saveHistory() {
            localStorage.setItem('saved_history_items', JSON.stringify(historyItems));
        }

        function renderHistory() {
            historyListEl.innerHTML = '';
            if (historyItems.length === 0) {
                historyListEl.innerHTML = '<div style="font-size:12px; color:#888;">無紀錄 (No history)</div>';
                return;
            }

            historyItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <input type="checkbox" data-id="${item.id}">
                    <span class="history-text" onclick="loadHistoryToInput('${escapeHtml(item.text)}')">${escapeHtml(item.text)}</span>
                `;
                historyListEl.appendChild(div);
            });
        }

        function loadHistoryToInput(text) {
            input.value = text;
        }

        function mergeSelectedHistory() {
            const checkboxes = historyListEl.querySelectorAll('input[type="checkbox"]:checked');
            const selectedIds = Array.from(checkboxes).map(cb => parseInt(cb.getAttribute('data-id')));

            if (selectedIds.length < 2) {
                alert("請至少選擇兩個紀錄進行合併 (Select at least 2 items to merge)");
                return;
            }

            const selectedItems = historyItems.filter(item => selectedIds.includes(item.id));
            const mergedText = selectedItems.map(item => item.text).join(" ");

            addHistoryItem(mergedText);
            input.value = mergedText;
        }

        function deleteSelectedHistory() {
            const checkboxes = historyListEl.querySelectorAll('input[type="checkbox"]:checked');
            const selectedIds = Array.from(checkboxes).map(cb => parseInt(cb.getAttribute('data-id')));

            if (selectedIds.length === 0) {
                alert("請選擇要刪除的紀錄 (Select items to delete)");
                return;
            }

            historyItems = historyItems.filter(item => !selectedIds.includes(item.id));
            saveHistory();
            renderHistory();
        }

        function clearText() {
            input.value = '';
            input.focus();
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "&#39;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
